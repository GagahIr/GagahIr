name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"    # jalan otomatis tiap hari jam 00:00 UTC
  workflow_dispatch:         # bisa dipicu manual dari tab Actions
  push:
    branches:
      - main

jobs:
  # 1) Snake contribution animation
  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: GagahIr
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) Stats card (overview) + Top languages — self-hosted, tidak bergantung ke vercel.app publik
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: jstrieb/github-stats@master
        with:
          username: GagahIr
          exclude_repos:
          exclude_langs:
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
